name: Deploy User Server

on:
  workflow_call:

jobs:
  # 1. User 서버 빌드
  build-user:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build User Server
        run: |
          npx prisma generate
          npm run build user-server

      - name: Upload User artifact
        uses: actions/upload-artifact@v4
        with:
          name: user-server-build
          path: dist/apps/user-server

  # 2. User 서버 배포
  deploy-user:
    concurrency: raspberry-pi-deploy
    runs-on: ubuntu-latest
    needs: build-user
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download User artifact
        uses: actions/download-artifact@v4
        with:
          name: user-server-build
          path: ./deploy-user-files

      - name: Compress files
        run: tar -czf deploy-user.tar.gz -C ./deploy-user-files .

      - name: Deploy to Raspberry Pi (reload user service)
        env:
          HOST: ${{ secrets.RASPBERRY_PI_HOST }}
          KEY: ${{ secrets.RASPBERRY_PI_SSH_PRIVATE_KEY }}
          USER: ${{ secrets.RASPBERRY_PI_USER }}
          PORT: ${{ secrets.RASPBERRY_PI_PORT }}
        run: |
          echo "$KEY" > private_key
          chmod 400 private_key

          scp -P "$PORT" -o StrictHostKeyChecking=no -i private_key deploy-user.tar.gz $USER@$HOST:~/inhu-backend/

          scp -P "$PORT" -o StrictHostKeyChecking=no -i private_key ./.github/workflows/scripts/deploy-dev-service-script.sh $USER@$HOST:~/inhu-backend/deploy-scripts/

          ssh -p "$PORT" -o StrictHostKeyChecking=no -i private_key $USER@$HOST \
            "bash ~/inhu-backend/deploy-scripts/deploy-dev-service-script.sh user"
