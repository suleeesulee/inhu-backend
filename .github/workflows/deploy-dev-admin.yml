name: Deploy Admin Server

on:
  workflow_call:

jobs:
  # 1. Admin 서버 빌드
  build-admin:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Admin Server
        run: |
          npx prisma generate
          npm run build admin-server

      - name: Upload Admin artifact
        uses: actions/upload-artifact@v4
        with:
          name: admin-server-build
          path: dist/apps/admin-server

  # 2. Admin 서버 배포
  deploy-admin:
    concurrency: raspberry-pi-deploy
    runs-on: ubuntu-latest
    needs: build-admin
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Admin artifact
        uses: actions/download-artifact@v4
        with:
          name: admin-server-build
          path: ./deploy-admin-files

      - name: Compress files
        run: tar -czf deploy-admin.tar.gz -C ./deploy-admin-files .

      - name: Deploy to Raspberry Pi (reload admin service)
        env:
          HOST: ${{ secrets.RASPBERRY_PI_HOST }}
          KEY: ${{ secrets.RASPBERRY_PI_SSH_PRIVATE_KEY }}
          USER: ${{ secrets.RASPBERRY_PI_USER }}
          PORT: ${{ secrets.RASPBERRY_PI_PORT }}
        run: |
          echo "$KEY" > private_key
          chmod 400 private_key

          scp -P "$PORT" -o StrictHostKeyChecking=no -i private_key deploy-admin.tar.gz $USER@$HOST:~/inhu-backend/

          scp -P "$PORT" -o StrictHostKeyChecking=no -i private_key ./.github/workflows/scripts/deploy-dev-service-script.sh $USER@$HOST:~/inhu-backend/deploy-scripts/

          ssh -p "$PORT" -o StrictHostKeyChecking=no -i private_key $USER@$HOST \
            "bash ~/inhu-backend/deploy-scripts/deploy-dev-service-script.sh admin"
